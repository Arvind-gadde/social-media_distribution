x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-social-media-distribution}"
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_BASE_URL: "http://localhost:9000/contentflow-media"
  QDRANT_URL: "http://qdrant:6333"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-social-media-distribution}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Application ─────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      APP_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:     { condition: service_healthy }
      redis:  { condition: service_healthy }
      minio:  { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --loop uvloop --http httptools"

  # ─── Celery Workers ──────────────────────────────────────────────────

  # Worker 1: Default queue — outbox processing, approvals, goal checks
  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
    command: >
      celery -A app.workers.celery_app worker
      -Q default
      -c 2
      --loglevel=info
      -n worker-default@%h
    # Override the API image's baked HTTP healthcheck — workers serve no HTTP.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-default@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Worker 2: Agent queue — content pipeline, competitor monitoring, analytics sync
  worker-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
    command: >
      celery -A app.workers.celery_app worker
      -Q agent
      -c 2
      --loglevel=info
      -n worker-agent@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-agent@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Worker 3: Distribution queue — publish jobs
  worker-distribution:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
    command: >
      celery -A app.workers.celery_app worker
      -Q distribution
      -c 2
      --loglevel=info
      -n worker-distribution@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-distribution@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Beat scheduler — single instance, drives all periodic tasks
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
    command: celery -A app.workers.celery_app beat --loglevel=info
    # Beat is a scheduler, not a worker — not pingable; drop the API healthcheck.
    healthcheck:
      disable: true
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* and the /api rewrite target (BACKEND_URL) are baked at
      # build time by Next.js — set your real domain here for prod.
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
        BACKEND_URL: "http://backend:8000"
    environment:
      NODE_ENV: "production"
      BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    # No source bind-mounts in production — the image's built .next is served.
    depends_on:
      - backend

  # ─── Observability ───────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ─── Reverse Proxy ───────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  redis_data:
  minio_data:
  qdrant_data:
  prom_data:
  grafana_data:
